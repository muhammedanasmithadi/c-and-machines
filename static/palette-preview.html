<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette redo — C and Machines</title>
<link rel="stylesheet" href="/css/book.css">
<style>
  body { background:#cfcbc0; color:#222; font-family:var(--serif); margin:0; }
  .nav { position:sticky; top:0; z-index:50; background:linear-gradient(#ece8de,#cfcbc0);
    border-bottom:2px solid #8a8578; padding:.7rem 1.2rem; font-family:var(--mono); font-size:var(--t-sm);
    display:flex; gap:.8rem; flex-wrap:wrap; align-items:baseline; }
  .nav a { color:#27447f; font-weight:600; text-decoration:none; }
  .nav span { color:#6b6d76; }
  .pal { margin:0; }
  .pal-band { padding:.55rem 1.2rem; font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.1em;
    text-transform:uppercase; border-bottom:1px solid rgba(0,0,0,.15); display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; }
  .pal-band b { font-size:var(--t-sm); letter-spacing:0; text-transform:none; }
  .chip { display:inline-block; width:1.4rem; height:1.4rem; border:1px solid rgba(0,0,0,.25); }

  .pal-1 { color-scheme: light;
    --paper:#f3f4f6; --paper-raised:#eceef1; --paper-inset:#e2e5ea;
    --ink:#23262b; --ink-soft:#474c54; --ink-faint:#737a84;
    --hairline:#d8dce1; --rule:#c2c8cf;
    --accent-100:#e8eaec; --accent-300:#b9c0c7; --accent-500:#5c6670;
    --accent-600:#454e57; --accent-700:#333b42; --accent-800:#20262c;
    --ok:#3d6b52; --bad:#8a4a38; }
  .pal-2 { color-scheme: light;
    --paper:#f2efe9; --paper-raised:#eae6dd; --paper-inset:#ded9cd;
    --ink:#2a2722; --ink-soft:#4e4a42; --ink-faint:#7d786d;
    --hairline:#dcd7cb; --rule:#c5bfb1;
    --accent-100:#e9e6dd; --accent-300:#c6bfae; --accent-500:#6f6a5e; --accent-600:#59544b;
    --accent-700:#413d36; --accent-800:#2a271f;
    --ok:#486b3f; --bad:#7a4a3a; }
  .pal-3 { color-scheme: light;
    --paper:#faf8f3; --paper-raised:#f1eee5; --paper-inset:#e6e2d5;
    --ink:#26241f; --ink-soft:#4c4941; --ink-faint:#7b7769;
    --hairline:#e1dbcd; --rule:#cbc3b0;
    --accent-100:#ecece9; --accent-300:#c3c4c2; --accent-500:#5b5f6e;
    --accent-600:#43495c; --accent-700:#2f3445; --accent-800:#1c2131;
    --ok:#41609b; --bad:#8a5a3a; }

  .pal > .site-header, .pal > .content, .pal > .site-footer { background:var(--paper); }
  .pal .content { padding-top:1.2rem; }
</style>
</head>
<body>
<div class="nav">
  <a href="#p1">1 · slate grey</a><span>|</span>
  <a href="#p2">2 · warm greige</a><span>|</span>
  <a href="#p3">3 · ivory + ink</a>
  &nbsp;<span>— three calm directions, very low chroma</span>
</div>
<div id="mount"></div>

<script>
const MACHINE = `
<div class="epigraph"><p>An address is only as good as the object it points to.</p>
<p class="attribution">— the rule, stated in advance, proved below</p></div>

<h2>Machine sample block</h2>
<p class="kicker">ALLOCATOR LEDGER — <a href="#">a link in ink, hover takes accent</a>; inline <code>malloc(8)</code>; the rule stays quiet.</p>

<div class="code-label">winner() — heap-storage variant</div>
<pre><code>Entry *winner(void) {
  Entry *p = malloc(sizeof *p);
  if (p) p->points = 7;
  return p;               /* caller must free() this exactly once */
}</code></pre>

<div class="proof">
  <div class="proof-block"><p class="proof-label">1 · The code</p>
    <p>The lab for this lesson, <code>labs/malloc/</code>, contains the three failure modes.</p></div>
  <div class="proof-block"><p class="proof-label">2 · The log</p>
    <p>Under AddressSanitizer, the failures report themselves:</p></div>
</div>

<div class="memmap-stepper">
<button class="push-btn" style="margin-bottom:.6rem">step</button>
<div class="memmap">
  <div class="memmap-row memmap-alloc"><span class="memmap-addr">0x4000</span><span>a — 8 B</span><span class="memmap-note">a owns 8 B; 40 B free</span></div>
  <div class="memmap-row memmap-free"><span class="memmap-addr">0x4008</span><span>b — 8 B</span><span class="memmap-note">b owns 8 B; 32 B free</span></div>
  <div class="memmap-row memmap-alloc"><span class="memmap-addr">0x4010</span><span>c — 32 B</span><span class="memmap-note">a,b,c own all 48 B</span></div>
</div>
<div class="ledger-caption">one 48-byte block, three allocations — the balance never breaks</div>
</div>

<p>Verdicts: <span class="ok">PASS</span> and <span class="bad">FAIL</span>.</p>
`;

const PALS = [
  { id:'p1', cls:'pal-1', name:'1 · Slate grey — cool, calm, technical',
    chips:['#f3f4f6','#e2e5ea','#23262b','#5c6670','#333b42','#3d6b52','#8a4a38'] },
  { id:'p2', cls:'pal-2', name:'2 · Warm greige — quiet, near-monochrome',
    chips:['#f2efe9','#ded9cd','#2a2722','#6f6a5e','#413d36','#486b3f','#7a4a3a'] },
  { id:'p3', cls:'pal-3', name:'3 · Ivory + ink — paper white, charcoal accent',
    chips:['#faf8f3','#e6e2d5','#26241f','#5b5f6e','#2f3445','#41609b','#8a5a3a'] },
];

async function main(){
  const res = await fetch('/');
  const doc = new DOMParser().parseFromString(await res.text(),'text/html');
  const kids = [...doc.body.childNodes].filter(n => n.nodeType===1 && /site-|MAIN/.test(n.tagName+' '+(n.className||'')));
  const mount = document.getElementById('mount');
  for (const p of PALS){
    const out=document.createElement('div'); out.className='pal '+p.cls; out.id=p.id;
    const band=document.createElement('div'); band.className='pal-band';
    band.style.background='var(--paper)'; band.style.color='var(--ink)';
    band.innerHTML='<b>'+p.name+'</b>'+p.chips.map(c=>'<span class="chip" style="background:'+c+'"></span>').join('')
      + PALS.map(q=>'<a href="#'+q.id+'" style="color:var(--accent-700)">'+q.id.replace('p','')+'</a>').join(' ');
    const clone=document.createElement('div'); clone.style.background='var(--paper)';
    kids.forEach(k=>clone.appendChild(k.cloneNode(true)));
    const mainEl=clone.querySelector('main');
    if(mainEl){ const s=document.createElement('div'); s.innerHTML=MACHINE; mainEl.appendChild(s); }
    out.appendChild(band); out.appendChild(clone); mount.appendChild(out);
    if(p.id!=='p3'){ const hr=document.createElement('div'); hr.style.cssText='height:3px;background:#8a8578;'; mount.appendChild(hr); }
  }
}
main();
</script>
</body>
</html>
